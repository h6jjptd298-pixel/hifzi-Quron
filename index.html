<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Qurʼon — Hifz va tilovat</title>
<meta name="description" content="Qurʼonni yodlash uchun sayt: uzilishsiz takrorlash, 120 dan ortiq qiroat, Madina mushafi va tarjimalar, hifz rejasi, sinov va tajvid.">
<meta name="theme-color" content="#0b1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Qurʼon Hifz">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Sans:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">

</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="pattern" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="splash" class="splash" role="status" aria-live="polite">
  <svg class="rosette-load" viewBox="0 0 200 200" aria-hidden="true"><g id="splashRose"></g></svg>
  <div class="splash-title">Qurʼon</div>
  <div class="splash-sub">Yuklanmoqda…</div>
</div>

<header class="top">
  <button class="brand" data-go="home" aria-label="Bosh sahifa">
    <svg viewBox="0 0 40 40" class="brand-mark" aria-hidden="true"><use href="#ic-star"/></svg>
    <span>Qurʼon</span>
  </button>
  <nav class="tabs" aria-label="Asosiy boʻlimlar">
    <button data-go="home" class="tab">Bosh sahifa</button>
    <button data-go="read" class="tab">Oʻqish</button>
    <button data-go="plan" class="tab">Hifz rejasi</button>
    <button data-go="test" class="tab">Sinov</button>
    <button data-go="stats" class="tab">Natijalar</button>
    <button data-go="settings" class="tab">Sozlamalar</button>
  </nav>
  <button class="icon-btn" id="themeQuick" aria-label="Mavzuni almashtirish" title="Mavzuni almashtirish"><svg><use href="#ic-moon"/></svg></button>
</header>

<main id="app" tabindex="-1"></main>

<!-- Player -->
<section id="player" class="player" aria-label="Ijro paneli" hidden>
  <div class="pl-progress"><div class="pl-bar" id="plBar"></div></div>
  <div class="pl-row">
    <div class="pl-info">
      <button class="pl-pick pl-title" id="plSura" title="Surani almashtirish" aria-label="Surani almashtirish"><span id="plTitle">—</span> <span class="pl-swap">▾ sura</span></button>
      <button class="pl-pick pl-sub" id="plQori" title="Qorini almashtirish" aria-label="Qorini almashtirish"><span id="plSub">—</span> <span class="pl-swap">▾ qorini almashtirish</span></button>
    </div>
    <div class="pl-ctrl">
      <button class="icon-btn" id="plPrev" aria-label="Oldingi oyat" title="Oldingi oyat"><svg><use href="#ic-prev"/></svg></button>
      <button class="play-btn" id="plPlay" aria-label="Ijro etish" title="Ijro etish"><svg><use href="#ic-play"/></svg></button>
      <button class="icon-btn" id="plNext" aria-label="Keyingi oyat" title="Keyingi oyat"><svg><use href="#ic-next"/></svg></button>
      <button class="icon-btn" id="plStop" aria-label="Toʻxtatish" title="Toʻxtatish"><svg><use href="#ic-stop"/></svg></button>
    </div>
    <div class="pl-extra">
      <button class="chip" id="plSpeed" title="Ijro tezligi">1×</button>
      <button class="chip" id="plSleep" title="Uyqu taymeri">Taymer</button>
      <button class="chip" id="plRelax" title="Tinch tinglash: tabiat ovozlari va fon videosi">🍃 Tinch</button>
      <button class="icon-btn" id="plFull" aria-label="Katta ekran" title="Katta ekran: oyatlarni yirik koʻrsatish"><svg><use href="#ic-expand"/></svg></button>
      <button class="icon-btn" id="plRepeat" aria-label="Takrorlash sozlamalari" title="Takrorlash sozlamalari"><svg><use href="#ic-repeat"/></svg></button>
    </div>
  </div>
</section>

<nav class="bottom-nav" aria-label="Asosiy boʻlimlar">
  <button data-go="home"><svg><use href="#ic-home"/></svg><span>Bosh</span></button>
  <button data-go="read"><svg><use href="#ic-book"/></svg><span>Oʻqish</span></button>
  <button data-go="plan"><svg><use href="#ic-plan"/></svg><span>Reja</span></button>
  <button data-go="test"><svg><use href="#ic-test"/></svg><span>Sinov</span></button>
  <button data-go="stats"><svg><use href="#ic-chart"/></svg><span>Natija</span></button>
  <button data-go="settings"><svg><use href="#ic-gear"/></svg><span>Sozlama</span></button>
</nav>

<div id="focus" class="focus" hidden role="dialog" aria-label="Katta ekran">
  <video id="fxVideo" class="fx-video" muted loop playsinline preload="none" aria-hidden="true"></video><div class="fx-dim" aria-hidden="true"></div>
  <div class="fx-rxinfo"><div class="fx-rx-sura" id="fxRxSura"></div><div class="fx-rx-sub" id="fxRxSub"></div><div class="fx-rx-ar" id="fxRxAr" lang="ar" dir="rtl"></div><div class="fx-rx-tr" id="fxRxTr"></div></div>
  <div class="fx-top">
    <div class="fx-head"><button class="fx-sura" id="fxSuraBtn" title="Surani almashtirish"><b id="fxTitle">—</b> <span class="pl-swap">▾</span></button><button class="fx-qori" id="fxQori" title="Qorini almashtirish">—</button></div>
    <div class="fx-tools">
      <button class="chip" id="fxRelax" title="Tinch tinglash: tabiat ovozlari va fon videosi">🍃 Tinch</button>
      <button class="chip" id="fxFm" title="Matnni kichraytirish">A−</button>
      <button class="chip" id="fxFp" title="Matnni kattalashtirish">A+</button>
      <button class="chip" id="fxTr" title="Tarjimani koʻrsatish yoki yashirish">Tarjima</button>
      <button class="icon-btn" id="fxClose" aria-label="Katta ekrandan chiqish" title="Chiqish"><svg><use href="#ic-shrink"/></svg></button>
    </div>
  </div>
  <div class="fx-body" id="fxBody"></div>
  <div class="fx-ctrl">
    <button class="icon-btn" id="fxPrevS" aria-label="Oldingi sura" title="Oldingi sura"><svg><use href="#ic-skipb"/></svg></button>
    <button class="icon-btn" id="fxPrev" aria-label="Oldingi oyat" title="Oldingi oyat"><svg><use href="#ic-prev"/></svg></button>
    <button class="play-btn" id="fxPlay" aria-label="Ijro etish" title="Ijro etish"><svg><use href="#ic-play"/></svg></button>
    <button class="icon-btn" id="fxNext" aria-label="Keyingi oyat" title="Keyingi oyat"><svg><use href="#ic-next"/></svg></button>
    <button class="icon-btn" id="fxNextS" aria-label="Keyingi sura" title="Keyingi sura"><svg><use href="#ic-skipf"/></svg></button>
    <span class="fx-sep"></span>
    <button class="icon-btn" id="fxRepeat" aria-label="Takrorlash sozlamalari" title="Takrorlash sozlamalari"><svg><use href="#ic-repeat"/></svg></button>
    <button class="icon-btn" id="fxCC" aria-label="Sura matnini koʻrsatish" title="Sura matnini (subtitrni) koʻrsatish yoki yashirish"><svg><use href="#ic-cc"/></svg></button>
    <button class="chip" id="fxTrBtn" title="Subtitr tagida tarjimani koʻrsatish">Tarjima</button>
    <button class="icon-btn" id="fxVolBtn" aria-label="Ovoz sozlamalari" title="Qori ovozi va fon ovozi"><svg><use href="#ic-speaker"/></svg></button>
    <div class="fx-vol" id="fxVol" hidden>
      <label><span>🎙 Qori ovozi</span><input type="range" id="fxQVol" min="0" max="1" step="0.02"></label>
      <label><span>🍃 Fon ovozi</span><input type="range" id="fxBVol" min="0" max="1" step="0.02"></label>
      <label class="fx-auto"><input type="checkbox" id="fxAuto"> <span>Sura tugagach keyingisiga oʻtish</span></label>
      <button class="chip" id="fxSounds">Tabiat ovozlari va video…</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">—</h2>
      <button class="icon-btn" data-close aria-label="Yopish" title="Yopish"><svg><use href="#ic-x"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div id="pop" class="pop" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<audio id="aMain" preload="auto"></audio>
<audio id="aAlt" preload="auto"></audio>
<audio id="aWord" preload="auto"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="ic-star" viewBox="0 0 40 40"><path d="M20 2l5.3 7.2 8.8-1.5-1.5 8.8L40 20l-7.4 5.3 1.5 8.8-8.8-1.5L20 40l-5.3-7.4-8.8 1.5 1.5-8.8L0 20l7.4-5.3-1.5-8.8 8.8 1.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="20" r="6" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
    <symbol id="ic-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-skipb" viewBox="0 0 24 24"><path d="M5 5v14M19 6l-6.5 6 6.5 6zM12.5 6L6 12l6.5 6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="ic-skipf" viewBox="0 0 24 24"><path d="M19 5v14M5 6l6.5 6L5 18zM11.5 6l6.5 6-6.5 6z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="ic-cc" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10.5 10.2a2.3 2.3 0 1 0 0 3.6M17 10.2a2.3 2.3 0 1 0 0 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
    <symbol id="ic-pause" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></symbol>
    <symbol id="ic-share" viewBox="0 0 24 24"><path d="M12 15V4m0 0L8 8m4-4l4 4M5 13v5a2 2 0 002 2h10a2 2 0 002-2v-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.9" fill="currentColor"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><circle cx="19" cy="12" r="1.9" fill="currentColor"/></symbol>
    <symbol id="ic-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor"/></symbol>
    <symbol id="ic-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM19 5v14L9 12z" fill="currentColor"/></symbol>
    <symbol id="ic-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM5 5v14l10-7z" fill="currentColor"/></symbol>
    <symbol id="ic-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h11l-3-3M20 13v2a3 3 0 0 1-3 3H6l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="ic-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-1.5v14c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5v-14c-3-.5-6 0-8 1.5zm0 0v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="ic-plan" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 3v4M15 3v4M8 15l2.5 2.5L16 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-test" viewBox="0 0 24 24"><path d="M9 4h6M10 4v5l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="ic-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-bookmark" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="ic-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-note" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5zM14 4v5h5M8 13h8M8 17h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="ic-tafsir" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="ic-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="ic-speaker" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<script src="app.js"></script>

</body>
</html>
